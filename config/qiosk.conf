; qiosk configuration
; Command-line arguments explicitly supplied to qiosk override these values.

[Browser]
; Initial page. URLs without a scheme default to https://.
url=https://salamek.github.io/chromium-kiosk/
; Seconds before returning to the initial state; 0 disables idle reset.
idle=0
; "default" uses the default profile; another name creates a persistent named profile.
profile-name=default
hide-cursor=false

[Window]
; hidden, automaticvisibility, windowed, minimized, maximized, fullscreen
mode=automaticvisibility
; Static title shown by the window manager.
title=qiosk
; Built-in icon or an absolute path to a custom image.
icon=:/icon.png

[Navbar]
display=false
underlay=false
; top, bottom
vertical-position=bottom
; left, right, center
horizontal-position=center
; Percentage of window size, from 1 through 100.
width=100
height=5
; Any comma-separated combination of: back, forward, reload, home
enabled-buttons=back,forward,reload,home

[Page]
display-addressbar=false
display-scroll-bars=false

; Comma-separated URL glob patterns. An empty or omitted value allows all URLs.
; white-list=https://example.com/*, https://static.example.com/*
;
; Comma-separated permissions. Available values:
; invalid-certificate, notifications, geolocation, media-audio-capture,
; media-video-capture, media-audio-video-capture, mouse-lock,
; desktop-video-capture, desktop-audio-video-capture
; allow-feature=notifications, geolocation

; When unset, Accept-Language and User-Agent are detected automatically.
; accept-language=cs-CZ
; user-agent=

[Connection]
; URL used to detect when the target web server becomes reachable.
; When unset, the origin of the requested page is used.
; test-url=https://example.com/
